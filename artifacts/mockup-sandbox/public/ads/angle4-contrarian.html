<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  .ad {
    width: 100vw; height: 100vh;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 7vh 8vw;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 2.5vw;
  }
  .logo-svg { flex-shrink: 0; width: 6vh; height: 6vh; }
  .logo-wordmark { display: flex; flex-direction: column; line-height: 1; }
  .logo-main {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2.4vh;
    color: #ffffff;
    letter-spacing: -0.03em;
  }
  .logo-sub {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 1.1vh;
    color: #0ea5e9;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 0.3vh;
  }
  .content { display: flex; flex-direction: column; gap: 3vh; }
  .headline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 6vh, 52px);
    line-height: 1.0;
    color: #ffffff;
    letter-spacing: -0.04em;
  }
  .headline .accent { color: #0ea5e9; }
  .benefit {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: clamp(13px, 2vh, 18px);
    color: rgba(255,255,255,0.75);
    line-height: 1.5;
  }
  .cta {
    display: inline-block;
    background: #0ea5e9;
    color: #ffffff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(12px, 1.9vh, 17px);
    padding: 2vh 4.5vw;
    border-radius: 0.6vh;
    letter-spacing: -0.01em;
    align-self: flex-start;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="logo">
    <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="40" height="40" rx="9" fill="#0ea5e9"/>
      <path d="M15 14 L15 11 Q15 8 20 8 Q25 8 25 11 L25 14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="7" y="14" width="26" height="18" rx="3" fill="white" fill-opacity="0.15" stroke="white" stroke-width="2"/>
      <line x1="7" y1="23" x2="33" y2="23" stroke="white" stroke-width="1.5" stroke-opacity="0.8"/>
      <rect x="17.5" y="21" width="5" height="4" rx="1" fill="white" fill-opacity="0.9"/>
      <text x="20" y="20" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="7.5" letter-spacing="1">AI</text>
    </svg>
    <div class="logo-wordmark">
      <span class="logo-main">AI Pivot</span>
      <span class="logo-sub">Toolbox</span>
    </div>
  </div>

  <div class="content">
    <div class="headline">
      Your SEO agency<br>is fighting<br><span class="accent">the last war.</span>
    </div>
    <div class="benefit">
      60% of searches now bypass Google entirely. Here's what to do.
    </div>
    <a class="cta" href="https://aipivot.com.au/book">Book Your Free Growth Map Call →</a>
  </div>

</div>
</body>
</html>
