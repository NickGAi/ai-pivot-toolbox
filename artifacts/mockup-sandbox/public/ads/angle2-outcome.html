<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #020b14;
  }
  .ad {
    width: 100vw; height: 100vh;
    background: #020b14;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 7vh 8vw;
    position: relative;
  }
  .glow-top {
    position: absolute;
    top: -5vh; right: -5vw;
    width: 55vw; height: 55vh;
    background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .glow-bottom {
    position: absolute;
    bottom: 0; left: 10vw;
    width: 45vw; height: 40vh;
    background: radial-gradient(circle, rgba(14,165,233,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 1.2vw;
  }
  .logo-mark {
    width: 5.5vh; height: 5.5vh;
    border-radius: 1.2vh;
    background: linear-gradient(135deg, #0ea5e9, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2.2vh;
    color: #fff;
    flex-shrink: 0;
  }
  .logo-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2.4vh;
    color: #f8fafc;
    letter-spacing: -0.02em;
  }
  .middle {
    display: flex;
    flex-direction: column;
    gap: 3vh;
  }
  .platforms {
    display: flex;
    gap: 1.5vw;
  }
  .platform-tag {
    font-family: 'Inter', sans-serif;
    font-size: 1.4vh;
    font-weight: 500;
    color: rgba(6,182,212,0.9);
    background: rgba(6,182,212,0.1);
    border: 1px solid rgba(6,182,212,0.25);
    padding: 0.7vh 1.8vw;
    border-radius: 50vh;
    letter-spacing: 0.02em;
  }
  .headline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 8vw;
    line-height: 1.05;
    color: #f8fafc;
    letter-spacing: -0.03em;
  }
  .headline .highlight {
    background: linear-gradient(90deg, #0ea5e9, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .benefit {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 2.1vh;
    color: rgba(248,250,252,0.55);
    line-height: 1.5;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 1.5vw;
    background: transparent;
    border: 1.5px solid #0ea5e9;
    color: #0ea5e9;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2vh;
    padding: 2.2vh 4.5vw;
    border-radius: 1.2vh;
    letter-spacing: -0.01em;
    align-self: flex-start;
  }
  .footer {
    font-family: 'Inter', sans-serif;
    font-size: 1.6vh;
    color: rgba(248,250,252,0.25);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>
  <div class="logo">
    <div class="logo-mark">AI</div>
    <span class="logo-name">AIPivot</span>
  </div>
  <div class="middle">
    <div class="platforms">
      <span class="platform-tag">ChatGPT</span>
      <span class="platform-tag">Perplexity</span>
      <span class="platform-tag">Google AI</span>
    </div>
    <div class="headline">
      Rank on<br><span class="highlight">AI search.</span><br>Get found.
    </div>
    <div class="benefit">Free AI SEO audit — see exactly where you stand.</div>
    <div class="cta">
      Get your free audit →
    </div>
  </div>
  <div class="footer">aipivot.com.au</div>
</div>
</body>
</html>
