<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #06050f; }
  .ad {
    width: 100vw; height: 100vh;
    background: #06050f;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6vh 7vw;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    top: -15vh; right: -15vw;
    width: 65vw; height: 65vh;
    background: radial-gradient(circle, rgba(14,165,233,0.2) 0%, transparent 65%);
    pointer-events: none;
  }
  .glow2 {
    position: absolute;
    bottom: -10vh; left: -10vw;
    width: 50vw; height: 50vh;
    background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 65%);
    pointer-events: none;
  }
  .logo { display: flex; align-items: center; gap: 1.2vw; position: relative; z-index: 2; }
  .logo-mark {
    width: 5vh; height: 5vh; border-radius: 1vh;
    background: linear-gradient(135deg, #0ea5e9, #06b6d4);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 2vh; color: #fff; flex-shrink: 0;
  }
  .logo-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 2.2vh; color: #f8fafc; letter-spacing: -0.02em;
  }
  .middle { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 2.8vh; }
  .headline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 6.2vw, 54px);
    line-height: 1.05;
    color: #f8fafc;
    letter-spacing: -0.04em;
    text-transform: uppercase;
  }
  .headline .blue {
    background: linear-gradient(90deg, #0ea5e9, #06b6d4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .or-free {
    display: inline-block;
    background: rgba(14,165,233,0.15);
    border: 1.5px solid #0ea5e9;
    color: #0ea5e9;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(12px, 1.6vh, 15px);
    padding: 0.8vh 2vw;
    border-radius: 0.5vh;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 0.5vh;
    align-self: flex-start;
  }
  .body {
    font-family: 'Inter', sans-serif;
    font-size: clamp(13px, 1.85vh, 17px);
    color: rgba(248,250,252,0.6);
    line-height: 1.55;
  }
  .proof-row {
    display: flex;
    gap: 3vw;
    flex-wrap: wrap;
  }
  .proof-item {
    display: flex;
    flex-direction: column;
  }
  .proof-num {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 3.5vh, 32px);
    color: #0ea5e9;
    line-height: 1;
  }
  .proof-label {
    font-family: 'Inter', sans-serif;
    font-size: clamp(10px, 1.35vh, 12px);
    color: rgba(248,250,252,0.45);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.3vh;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 1.5vw;
    background: linear-gradient(135deg, #0ea5e9, #06b6d4);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(13px, 1.9vh, 17px);
    padding: 2vh 4vw;
    border-radius: 0.7vh;
    letter-spacing: -0.01em;
    align-self: flex-start;
  }
  .footer {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
  }
  .domain { font-family: 'Inter', sans-serif; font-size: clamp(10px, 1.5vh, 13px); color: rgba(248,250,252,0.25); }
  .badge {
    font-family: 'Inter', sans-serif;
    font-size: clamp(9px, 1.3vh, 11px);
    color: rgba(6,182,212,0.7);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border: 1px solid rgba(6,182,212,0.3);
    padding: 0.5vh 1.5vw;
    border-radius: 0.4vh;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="logo">
    <div class="logo-mark">AI</div>
    <span class="logo-name">AIPivot</span>
  </div>
  <div class="middle">
    <div class="headline">
      Rank #1 on<br><span class="blue">Google & AI Search</span><br>in 60 days.
    </div>
    <div class="or-free">Or we work for free — guaranteed.</div>
    <div class="proof-row">
      <div class="proof-item">
        <span class="proof-num">60</span>
        <span class="proof-label">Day results</span>
      </div>
      <div class="proof-item">
        <span class="proof-num">24/7</span>
        <span class="proof-label">AI running</span>
      </div>
      <div class="proof-item">
        <span class="proof-num">100%</span>
        <span class="proof-label">Leads followed up</span>
      </div>
    </div>
    <div class="cta">Get Free Strategy Session →</div>
  </div>
  <div class="footer">
    <span class="domain">aipivot.com.au</span>
    <span class="badge">Brisbane · Australia-wide</span>
  </div>
</div>
</body>
</html>
