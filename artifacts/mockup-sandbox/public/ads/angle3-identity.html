<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #0c0c14;
  }
  .ad {
    width: 100vw; height: 100vh;
    background: #0c0c14;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 7vh 8vw;
    position: relative;
  }
  .stripe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 0.5vh;
    background: linear-gradient(90deg, #0ea5e9, #06b6d4, transparent);
  }
  .glow {
    position: absolute;
    bottom: -5vh; right: -5vw;
    width: 50vw; height: 50vh;
    background: radial-gradient(circle, rgba(14,165,233,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 1.2vw;
  }
  .logo-mark {
    width: 5.5vh; height: 5.5vh;
    border-radius: 1.2vh;
    background: linear-gradient(135deg, #0ea5e9, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2.2vh;
    color: #fff;
    flex-shrink: 0;
  }
  .logo-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2.4vh;
    color: #f8fafc;
    letter-spacing: -0.02em;
  }
  .middle {
    display: flex;
    flex-direction: column;
    gap: 3vh;
  }
  .location-badge {
    display: inline-flex;
    align-items: center;
    gap: 1vw;
    font-family: 'Inter', sans-serif;
    font-size: 1.6vh;
    font-weight: 500;
    color: rgba(248,250,252,0.7);
    letter-spacing: 0.04em;
  }
  .flag {
    font-size: 2.2vh;
  }
  .headline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 8.5vw;
    line-height: 1.05;
    color: #f8fafc;
    letter-spacing: -0.03em;
  }
  .headline .blue {
    color: #0ea5e9;
  }
  .services {
    display: flex;
    flex-direction: column;
    gap: 1.2vh;
  }
  .service-line {
    display: flex;
    align-items: center;
    gap: 1.5vw;
    font-family: 'Inter', sans-serif;
    font-size: 1.9vh;
    color: rgba(248,250,252,0.65);
  }
  .tick {
    color: #06b6d4;
    font-size: 1.9vh;
    flex-shrink: 0;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 1.5vw;
    background: linear-gradient(135deg, #0ea5e9, #06b6d4);
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2vh;
    padding: 2.2vh 4.5vw;
    border-radius: 1.2vh;
    letter-spacing: -0.01em;
    align-self: flex-start;
  }
  .footer {
    font-family: 'Inter', sans-serif;
    font-size: 1.6vh;
    color: rgba(248,250,252,0.25);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="stripe"></div>
  <div class="glow"></div>
  <div class="logo">
    <div class="logo-mark">AI</div>
    <span class="logo-name">AIPivot</span>
  </div>
  <div class="middle">
    <div class="location-badge">
      <span class="flag">🇦🇺</span>
      Brisbane-based. Australia-wide.
    </div>
    <div class="headline">
      Built for<br><span class="blue">Aussie</span><br>business.
    </div>
    <div class="services">
      <div class="service-line"><span class="tick">✓</span> AI SEO &amp; AI Search</div>
      <div class="service-line"><span class="tick">✓</span> Sales &amp; Lead Automation</div>
      <div class="service-line"><span class="tick">✓</span> Websites &amp; Software</div>
    </div>
    <div class="cta">
      Free strategy call →
    </div>
  </div>
  <div class="footer">aipivot.com.au</div>
</div>
</body>
</html>
